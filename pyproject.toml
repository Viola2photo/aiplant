[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiplant"
version = "0.1.0"
description = "Automated plant-ecology short/long video production and scheduling pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
aiplant = "aiplant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
